name: CD

# Publishes the workspace packages to GitHub Packages on every push to main.
# Phase 1 runs semantic-release per package (conventional-commit versioning,
# git tag `<pkg>-v<version>`, GitHub release, and an in-tree package.json
# version bump — but no npm publish). Phase 2 runs `pnpm -r publish`, which
# resolves each `workspace:*` interdependency to the freshly-bumped sibling
# version and uploads every package to the registry in dependency order.

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create tags + GitHub releases
  issues: write # semantic-release release comments
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) — no long-lived npm token

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so semantic-release can read tags + commit range.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          # Points npm at the public registry so `npm publish` performs the
          # OIDC trusted-publishing exchange (requires npm >= 11.5.1, bundled
          # with Node 24).
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log

      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log

      # Phase 1 — version, tag, and release each package (no publish). Version
      # order is irrelevant here: publish (phase 2) resolves interdeps after all
      # versions are set. A package with no releasable commits is simply skipped.
      - name: Version + tag + release (semantic-release)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          for pkg in typescript-config eslint-config shared-helpers ui auth mcp onboarding; do
            echo "::group::semantic-release $pkg"
            ( cd "packages/$pkg" \
                && pnpm dlx semantic-release --tag-format "$pkg-v\${version}" )
            echo "::endgroup::"
          done

      # Phase 2 — publish every package whose version is not yet in the registry.
      # pnpm rewrites `workspace:*` to the concrete sibling versions bumped above
      # and publishes in dependency order. Already-published versions are skipped.
      # Phase 2 — publish each package to npm via OIDC trusted publishing (no
      # token). npm resolves auth from the GitHub OIDC identity; it does not
      # understand `workspace:*`, so resolve those to concrete sibling versions
      # first. Publish in dependency order so a dependent never references an
      # unpublished sibling. Already-published versions are skipped (idempotent).
      - name: Publish to npm (OIDC, private)
        shell: bash
        run: |
          set -o pipefail
          node scripts/prepare-publish.mjs
          for pkg in typescript-config eslint-config shared-helpers ui auth mcp onboarding; do
            echo "::group::npm publish $pkg"
            if ( cd "packages/$pkg" \
                   && npm publish --access restricted --provenance=false ) 2>&1 | tee -a publish.log; then
              echo "published $pkg"
            else
              # Tolerate a re-published (already-live) version so reruns are safe.
              grep -q "cannot publish over the previously published versions" publish.log \
                && echo "skip $pkg (version already published)" || exit 1
            fi
            echo "::endgroup::"
          done
