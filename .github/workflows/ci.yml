  unit-tests:
    name: Unit Tests
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: turbo --affected diffs against the base ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
