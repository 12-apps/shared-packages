name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded in-flight runs so a new push preempts its own stale work.
#
# Push runs on main are keyed by SHA, not by ref, and that is load-bearing here:
# GitHub allows only ONE pending run per concurrency group, and a newer arrival
# CANCELS the older PENDING one. While every merge shared a single
# `refs/heads/main` group, a burst of merges could silently drop an intermediate
# run — and on this repo a dropped push run is a dropped `release` job, i.e. a
# version that never reaches npm. One group per SHA gives every merge its own
# run. PRs keep the ref-keyed group, where preempting stale work is the point.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# Every publishable package, in topological order (dependencies first).
# Paths rather than names because payments is a nested workspace.
#
# Workflow-level so the release job and the consumer-verification job read ONE
# list. Duplicating it per job is how a package ends up published but never
# verified — or verified but never published.
env:
  PUBLISH_DIRS: >-
    packages/eslint-config
    packages/typescript-config
    packages/observability-backend
    packages/auth
    packages/entitlements
    packages/entity-lifecycle
    packages/forms-core
    packages/jobs
    packages/payments/backend
    packages/product-research
    packages/rbac
    packages/realtime
    packages/shift
    packages/stock-domain
    packages/payments/frontend
    packages/payments/e2e
    packages/ui
    packages/pwa
    packages/observability-frontend
    packages/onboarding
    packages/product-research-ui
    packages/report-builder
    packages/mcp
    packages/shared-helpers

jobs:
  # ── Change detection ───────────────────────────────────────────────────────
  # Every job below used to start unconditionally, so a README-only PR paid ten
  # runners, ten checkouts and ten `pnpm install`s to prove nothing. This job
  # answers "can this diff reach anything CI builds?" once, and the jobs read it.
  #
  # On PUSH it reports every category true (`force-all`), which is the safety net
  # the PR-time selection rests on: the post-merge run skips nothing, so a filter
  # that is too narrow is caught at the merge rather than shipping. It is also
  # what keeps `release` (which needs every gate) intact on main.
  #
  # This repo has no `monorepo-static.yml` tier, so a standalone detector is the
  # right shape here — see the "When NOT to use this" note in 12-apps/ci's README
  # for why a repo that HAS that tier must use its `extra-filters` input instead.
  changes:
    name: Detect Changes
    # REQUIRED, and not optional boilerplate: a called workflow may not request
    # more than its caller grants, and this file's workflow-level block is
    # `contents: read` alone. detect-changes.yml declares `pull-requests: read`
    # (the paths filter reads a PR's file list from the API rather than diffing
    # a checkout), so without this the whole RUN is rejected at startup — no
    # jobs, no logs, just a failed run.
    permissions:
      contents: read
      pull-requests: read
    uses: 12-apps/ci/.github/workflows/detect-changes.yml@v2
    with:
      # Deliberately COARSE, because these two categories answer only the CHEAP
      # question: "can this diff reach anything CI builds at all?" That is what a
      # path glob is good for, and a docs-only PR is what it makes free.
      #
      # It is NOT the tool for "which packages does this diff affect?" — these
      # packages import each other, so a per-package glob would have to encode
      # the dependency graph by hand and would silently skip real coverage the
      # first time someone forgot to widen one. That question is now answered by
      # turbo itself, from the manifests, in the lint/type-check/build/unit-test
      # jobs below (`turbo run … --affected`). Globs bound WHETHER the pipeline
      # runs; the graph bounds WHICH packages it runs for.
      #
      # The lanes that stay whole-workspace are the ones that genuinely are:
      # portability lints files OUTSIDE packages/payments/** by design, and the
      # harness/consumer lanes pack EVERY package into tarballs.
      path-filters: |
        # Anything that can affect a build, a type, a lint or a test.
        # Everything NOT matched here is documentation, and documentation-only
        # PRs are exactly what this exists to make free.
        code:
          - 'packages/**'
          - 'harness/**'
          - 'scripts/**'
          - '.github/workflows/**'
          - '*.mjs'
          - '*.json'
          - '.npmrc'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'
        # The lanes that exercise the PUBLISHED surface (tarballs, storybook,
        # both harnesses). They cannot be reached by a change to a root quality
        # script, which is the one useful thing this separates from `code`.
        publishable:
          - 'packages/**'
          - 'harness/**'
          - 'scripts/harness-install.mjs'
          - 'scripts/prepare-publish.mjs'
          - 'scripts/verify-package-consumers.mjs'
          - 'pnpm-lock.yaml'
          - 'pnpm-workspace.yaml'
          # Self-verifying: narrowing these filters must re-run the lanes they
          # gate, or a filter could be quietly weakened with nothing to catch it.
          - '.github/workflows/ci.yml'
      force-all: ${{ github.event_name == 'push' }}

  lint:
    name: Lint
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: turbo --affected diffs against the base ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # turbo selects by the real dependency GRAPH, which is the thing a path
      # glob cannot do: a change in packages/ui reaches payments-frontend because
      # the manifest says so, not because someone remembered to widen a filter.
      - name: Fetch the base branch for turbo --affected
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF"
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          # PR: only the packages this diff can reach, per the turbo graph.
          # push: the whole workspace — the post-merge safety net that makes
          # PR-time selection safe to trust in the first place.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run lint --affected 2>&1 | tee lint.log
          else
            pnpm turbo run lint 2>&1 | tee lint.log
          fi

  type-check:
    name: Type Check
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: turbo --affected diffs against the base ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # turbo selects by the real dependency GRAPH, which is the thing a path
      # glob cannot do: a change in packages/ui reaches payments-frontend because
      # the manifest says so, not because someone remembered to widen a filter.
      - name: Fetch the base branch for turbo --affected
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF"
      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          # PR: only the packages this diff can reach, per the turbo graph.
          # push: the whole workspace — the post-merge safety net that makes
          # PR-time selection safe to trust in the first place.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run check-types --affected 2>&1 | tee typecheck.log
          else
            pnpm turbo run check-types 2>&1 | tee typecheck.log
          fi

  build:
    name: Build
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: turbo --affected diffs against the base ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # turbo selects by the real dependency GRAPH, which is the thing a path
      # glob cannot do: a change in packages/ui reaches payments-frontend because
      # the manifest says so, not because someone remembered to widen a filter.
      - name: Fetch the base branch for turbo --affected
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # PR: only the packages this diff can reach, per the turbo graph.
          # push: the whole workspace — the post-merge safety net that makes
          # PR-time selection safe to trust in the first place.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run build --affected 2>&1 | tee build.log
          else
            pnpm turbo run build 2>&1 | tee build.log
          fi

  unit-tests:
    name: Unit Tests
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: turbo --affected diffs against the base ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # turbo selects by the real dependency GRAPH, which is the thing a path
      # glob cannot do: a change in packages/ui reaches payments-frontend because
      # the manifest says so, not because someone remembered to widen a filter.
      - name: Fetch the base branch for turbo --affected
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --no-tags --depth=50 origin "$GITHUB_BASE_REF"
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          # PR: only the packages this diff can reach, per the turbo graph.
          # push: the whole workspace — the post-merge safety net that makes
          # PR-time selection safe to trust in the first place.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run test --affected 2>&1 | tee unit.log
          else
            pnpm turbo run test 2>&1 | tee unit.log
          fi

  # Static-quality gate via the org's reusable workflow (12-apps/ci): complexity,
  # flakiness, duplication, flaky quarantine, knip (shrink-only ratchet), and the
  # .quality-exceptions burn-down. No e2e lanes here — this repo ships libraries,
  # not a runnable app — so both e2e inputs are disabled.
  quality:
    name: Quality
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    # Least-privilege: the reusable quality gate only reads the repo. Grant
    # exactly this so nothing broader leaks into the reusable workflow.
    permissions:
      contents: read
    uses: 12-apps/ci/.github/workflows/quality.yml@v1
    with:
      run-e2e-reliability: false
      run-affected-e2e: false
      install-playwright: false

  # The stories are the deliverable that lets a human review every checkout
  # state without seeding a store or running a backend (FUT-742) — so a story
  # that no longer compiles has to be a red check, not something a reviewer
  # discovers by opening Storybook. `pnpm build` never touches them: this
  # package publishes source, so its `build` task is a no-op and the stories are
  # reached only by .storybook/main.ts's own glob.
  #
  # The RENDER half is covered by unit tests (`stories-render.test.tsx`, in the
  # Unit Tests job): every story mounts, and a tripwire on `globalThis.fetch`
  # fails the run if any of them reaches the network.
  storybook:
    name: Storybook
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build the payments checkout Storybook
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @12-apps/payments-frontend storybook:build 2>&1 | tee storybook.log
      - uses: actions/upload-artifact@v4
        with:
          name: payments-storybook
          path: packages/payments/frontend/storybook-static
          retention-days: 7

  # The payments PORTABILITY gate (FUT-562). Separate from `quality` above
  # because that job is the org's reusable workflow (12-apps/ci) and knows
  # nothing about this repo's payments package.
  #
  # `packages/payments/ADOPTING.md` §6 listed these rules and said they were
  # "enforced by review". Review is what let a host repo grow a PagBank-shaped
  # checkout and a 1,165-line fork of the settings page.
  #
  # These rules do NOT cover provider-specific PAYLOAD SHAPES — a field name
  # like `order_nsu` names no provider, so nothing here would have caught
  # FUT-726. Worth knowing before trusting the gate with that class.
  #
  # TWO steps, both required. The gate alone cannot tell "the tree is portable"
  # apart from "my globs match nothing", and the second reports a safety it is
  # not providing — so the self-test lints a deliberate violation of each rule
  # through the same config and fails if any of them comes back clean.
  portability:
    name: Payments Portability
    needs: changes
    # Gated on `code`, NOT on a payments-only filter: rule 2 of the gate
    # (`payments/no-provider-names`) applies to source OUTSIDE
    # packages/payments/**, so a vendor name introduced in packages/ui is
    # exactly what it exists to catch. A payments-scoped filter would
    # disarm it for that case without anything going red.
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # ONE script, not its two halves rewritten here. `quality:portability` is
      # `quality:portability:selftest && eslint --config …`; spelling those out
      # in the workflow is how CI and the command a developer runs drift — add a
      # third step to the script and only the local run would get it.
      - name: Payments portability gate
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:portability 2>&1 | tee portability.log

  # The only gate that sees what a CONSUMER sees. Every other job above runs
  # inside the pnpm workspace, where a sibling import resolves whether or not the
  # manifest declares it and every file is on disk whether or not `files` would
  # ship it — so a packaging bug is invisible to all of them. Four reached the
  # registry that way (an empty tarball, undeclared plugins, a missing export, a
  # dependency hidden in devDependencies), each found by hand in an app that had
  # already installed it. This packs the tarballs and installs them outside the
  # workspace. See scripts/verify-package-consumers.mjs.
  consumers:
    name: Consumer Verification
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # shared-helpers publishes ./dist, so the tarball is only complete after a
      # build — exactly as in the release job below.
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Verify the published packages from a consumer's side
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-package-consumers.mjs 2>&1 | tee consumers.log

  # Layer 2 of the same idea: Consumer Verification proves the packages RESOLVE
  # from a tarball; this proves they still WORK once a browser runs them. It
  # renders the published payments adapters through the published settings page
  # — the pairing future-pay is currently failing on, which neither repo's CI
  # covers: this one tests each package against its workspace siblings, and
  # future-pay finds out at e2e time, a release too late.
  frontend-harness:
    name: Frontend Harness
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      # Packs every package and installs the tarballs into harness/frontend,
      # which sits outside pnpm-workspace.yaml's globs so nothing links back to
      # packages/. Its package.json is generated here, not committed.
      - name: Install the harness against the published tarballs
        shell: bash
        run: |
          set -o pipefail
          node scripts/harness-install.mjs 2>&1 | tee harness-install.log
      - name: Install Chromium
        working-directory: harness/frontend
        run: npx playwright install --with-deps chromium
      - name: Build the harness app
        working-directory: harness/frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee harness-build.log
      - name: Render the published packages in a browser
        working-directory: harness/frontend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee harness-test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-harness-report
          path: harness/frontend/playwright-report
          retention-days: 7

  # The server half of the same question. The frontend harness proves the
  # published UI renders whatever descriptors it is handed; this proves the
  # published backend produces four of them through its own HTTP handler, and
  # that the prisma schema partial and six migrations it ships actually apply to
  # a real Postgres — assets no other job in this repo ever opens.
  backend-harness:
    name: Backend Harness
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Install the harness against the published tarballs
        shell: bash
        run: |
          set -o pipefail
          node scripts/harness-install.mjs 2>&1 | tee harness-install.log
      - name: Exercise the published backend
        working-directory: harness/backend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee harness-test.log

  # Tokenless publish to npm via OIDC Trusted Publishing. Only on push to main,
  # after the gates pass. No NPM_TOKEN: npm exchanges the GitHub OIDC id-token
  # for a short-lived credential (requires a one-time Trusted Publisher on npm
  # pointing at this repo + ci.yml). semantic-release versions/tags/releases each
  # package (npmPublish:false); the actual upload is the OIDC npm publish below.
  # The one thing OIDC cannot do is a package's first publish — see the step
  # ahead of it, which is the only place a token is ever used.
  release:
    name: Release
    needs: [lint, type-check, build, unit-tests, quality, storybook, consumers, frontend-harness, backend-harness, portability]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags + GitHub releases
      issues: write # semantic-release's "release is failing" issue
      pull-requests: write # the `released` label semantic-release puts on a PR
      id-token: write # OIDC trusted publishing — no token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Version + tag + release (semantic-release)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Directory paths, not bare names: payments ships as a nested
          # workspace (packages/payments/{backend,frontend}). Order is
          # topological — a package is released only after everything it
          # depends on, so prepare-publish.mjs always resolves workspace:*
          # interdeps to a version that already exists.
          #
          # Each iteration is an independent release, and what bounds it to ONE
          # package is `extends: semantic-release-monorepo` in every
          # .releaserc.json: it filters the commit range down to the commits
          # that touched this directory. Without it every run analysed the whole
          # repo history, so a single `feat(payments)` merge cut a release for
          # all 24 packages — 24 tags, 24 GitHub releases and 24 PR comments per
          # merge, for 23 packages whose files had not changed at all.
          #
          # `pnpm exec`, not `pnpm dlx`: the config `extends` a module, so
          # semantic-release has to run with the workspace's node_modules on its
          # resolution path. Pinning it in package.json also means a release is
          # no longer built by whatever version was latest that morning.
          #
          # --tag-format keeps the tag scheme this repo already has (`ui-v1.2.3`,
          # 700+ tags deep). It deliberately overrides the `@12-apps/ui-v1.2.3`
          # that semantic-release-monorepo would otherwise impose — under that
          # scheme no package would find its own last tag, every one would look
          # unreleased, and they would all reset to 1.0.0.
          for dir in $PUBLISH_DIRS; do
            pkg="$(basename "$dir")"
            echo "::group::semantic-release $pkg"
            ( cd "$dir" \
                && pnpm exec semantic-release --tag-format "$pkg-v\${version}" )
            echo "::endgroup::"
          done
      # OIDC trusted publishing needs npm >= 11.5.1 (Node 24 ships an older npm).
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest
      # A package's FIRST publish cannot go through OIDC — a Trusted Publisher is
      # configured on a package that does not exist yet — so it is the one thing
      # the tokenless loop below can never do. This step does exactly that much
      # and no more: it publishes names the registry does not have and skips
      # every package it does. Without an NPM_TOKEN secret it is a no-op.
      - name: First publish for packages not yet on the registry
        shell: bash
        env:
          # setup-node's npmrc reads this variable, so the bootstrap publish is
          # token-authenticated. The tokenless step below does not set it, and
          # deletes that npmrc line anyway before publishing over OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          # npm cannot resolve workspace:* — rewrite interdeps to concrete versions.
          node scripts/prepare-publish.mjs
          node scripts/first-publish.mjs 2>&1 | tee first-publish.log
      - name: Publish to npm (OIDC, tokenless)
        shell: bash
        run: |
          set -o pipefail
          # npm cannot resolve workspace:* — rewrite interdeps to concrete versions.
          node scripts/prepare-publish.mjs
          # setup-node wrote an empty _authToken=${NODE_AUTH_TOKEN} that SHADOWS
          # OIDC (forcing anonymous auth -> 404). Remove it so npm uses the OIDC
          # id-token for trusted publishing.
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          node scripts/publish.mjs

  # What this PR's CI has cost, as one comment that is edited in place on every
  # push rather than a new comment per run.
  #
  # This repo is PUBLIC, so these minutes are not billed — the comment says so
  # itself. It is here for gross-minute visibility and trend, which is the thing
  # nobody has today, not for a line on an invoice.
  #
  # `always()` so the estimate still posts when a gate failed: a red run costs
  # the same minutes as a green one, and that is exactly when the number is
  # worth seeing. Deliberately NOT in `ci-success`'s needs — a reporting lane
  # must never be able to fail the merge.
  cost-report:
    name: CI Cost
    if: always() && github.event_name == 'pull_request'
    # Every heavy lane, so the report runs LAST and sees as much of the run as
    # possible. The job's own minutes, and anything still running beside it, are
    # necessarily not counted yet — the comment states that caveat.
    needs: [changes, lint, type-check, build, unit-tests, quality, storybook, consumers, frontend-harness, backend-harness, portability]
    # Required at the caller: a reusable workflow's effective grant is the
    # INTERSECTION with its caller's, so omitting either yields a 403 rather
    # than a wrong number. This job needs no `contents` access at all.
    permissions:
      pull-requests: write
      actions: read
    uses: 12-apps/ci/.github/workflows/cost-report.yml@v2
    secrets: inherit

  # Required-checks aggregation: one status that branch protection can gate on,
  # green only when every prerequisite job succeeded.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    # `changes` MUST be listed even though every other job depends on it. If it
    # FAILS, its dependents go `skipped` — not `failure` — and this aggregation
    # treats `skipped` as fine, so without it a broken change-detector would
    # report green with zero tests run.
    #
    # `release` MUST be listed for a related but distinct reason: it is the only
    # job whose failure nothing else can reveal. Every gate above is also run on
    # the PR, so a broken one is caught before merge; `release` runs ONLY on the
    # push to main, and if it fails the packages simply do not publish. Without
    # it here the run goes green, the merge looks finished, and the gap surfaces
    # much later as a consumer pinning a version that was never cut.
    #
    # That is not hypothetical — it is why this line exists. `@12-apps/auth`'s
    # browser half merged, its release failed on a push race with the release
    # 11 minutes before it, `CI Success` reported green, and the package sat
    # unpublished until a consumer could not resolve `@12-apps/auth/react`.
    #
    # On a pull request `release` is skipped, which this aggregation already
    # treats as fine — so this costs PRs nothing.
    needs: [changes, lint, type-check, build, unit-tests, quality, storybook, consumers, frontend-harness, backend-harness, portability, release]
    steps:
      - name: Verify all required jobs passed
        shell: bash
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Upstream results: $results"
          if echo "$results" | tr ',' '\n' | grep -qvE '^(success|skipped)$'; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
