  # Static-quality gate via the org's reusable workflow (12-apps/ci): complexity,
  # flakiness, duplication, flaky quarantine, knip (shrink-only ratchet), and the
  # .quality-exceptions burn-down. No e2e lanes here — this repo ships libraries,
  # not a runnable app — so both e2e inputs are disabled.
  quality:
    name: Quality
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    # Least-privilege: the reusable quality gate only reads the repo. Grant
    # exactly this so nothing broader leaks into the reusable workflow.
    permissions:
      contents: read
    uses: 12-apps/ci/.github/workflows/quality.yml@v1
    with:
      run-e2e-reliability: false
      run-affected-e2e: false
      install-playwright: false

  # The stories are the deliverable that lets a human review every checkout
  # state without seeding a store or running a backend (FUT-742) — so a story
  # that no longer compiles has to be a red check, not something a reviewer
  # discovers by opening Storybook. `pnpm build` never touches them: this
  # package publishes source, so its `build` task is a no-op and the stories are
  # reached only by .storybook/main.ts's own glob.
  #
  # The RENDER half is covered by unit tests (`stories-render.test.tsx`, in the
  # Unit Tests job): every story mounts, and a tripwire on `globalThis.fetch`
  # fails the run if any of them reaches the network.
  storybook:
    name: Storybook
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build the payments checkout Storybook
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @12-apps/payments-frontend storybook:build 2>&1 | tee storybook.log
      - uses: actions/upload-artifact@v4
        with:
          name: payments-storybook
          path: packages/payments/frontend/storybook-static
          retention-days: 7

  # The payments PORTABILITY gate (FUT-562). Separate from `quality` above
  # because that job is the org's reusable workflow (12-apps/ci) and knows
  # nothing about this repo's payments package.
  #
  # `packages/payments/ADOPTING.md` §6 listed these rules and said they were
  # "enforced by review". Review is what let a host repo grow a PagBank-shaped
  # checkout and a 1,165-line fork of the settings page.
  #
  # These rules do NOT cover provider-specific PAYLOAD SHAPES — a field name
  # like `order_nsu` names no provider, so nothing here would have caught
  # FUT-726. Worth knowing before trusting the gate with that class.
  #
  # TWO steps, both required. The gate alone cannot tell "the tree is portable"
  # apart from "my globs match nothing", and the second reports a safety it is
  # not providing — so the self-test lints a deliberate violation of each rule
  # through the same config and fails if any of them comes back clean.
  portability:
    name: Payments Portability
    needs: changes
    # Gated on `code`, NOT on a payments-only filter: rule 2 of the gate
    # (`payments/no-provider-names`) applies to source OUTSIDE
    # packages/payments/**, so a vendor name introduced in packages/ui is
    # exactly what it exists to catch. A payments-scoped filter would
    # disarm it for that case without anything going red.
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # ONE script, not its two halves rewritten here. `quality:portability` is
      # `quality:portability:selftest && eslint --config …`; spelling those out
      # in the workflow is how CI and the command a developer runs drift — add a
      # third step to the script and only the local run would get it.
      - name: Payments portability gate
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:portability 2>&1 | tee portability.log

  # The only gate that sees what a CONSUMER sees. Every other job above runs
  # inside the pnpm workspace, where a sibling import resolves whether or not the
  # manifest declares it and every file is on disk whether or not `files` would
  # ship it — so a packaging bug is invisible to all of them. Four reached the
  # registry that way (an empty tarball, undeclared plugins, a missing export, a
  # dependency hidden in devDependencies), each found by hand in an app that had
  # already installed it. This packs the tarballs and installs them outside the
  # workspace. See scripts/verify-package-consumers.mjs.
  consumers:
    name: Consumer Verification
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      # shared-helpers publishes ./dist, so the tarball is only complete after a
      # build — exactly as in the release job below.
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Verify the published packages from a consumer's side
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-package-consumers.mjs 2>&1 | tee consumers.log

  # Layer 2 of the same idea: Consumer Verification proves the packages RESOLVE
  # from a tarball; this proves they still WORK once a browser runs them. It
  # renders the published payments adapters through the published settings page
  # — the pairing future-pay is currently failing on, which neither repo's CI
  # covers: this one tests each package against its workspace siblings, and
  # future-pay finds out at e2e time, a release too late.
  frontend-harness:
    name: Frontend Harness
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      # Packs every package and installs the tarballs into harness/frontend,
      # which sits outside pnpm-workspace.yaml's globs so nothing links back to
      # packages/. Its package.json is generated here, not committed.
      - name: Install the harness against the published tarballs
        shell: bash
        run: |
          set -o pipefail
          node scripts/harness-install.mjs 2>&1 | tee harness-install.log
      - name: Install Chromium
        working-directory: harness/frontend
        run: npx playwright install --with-deps chromium
      # No `npm run build` step: playwright.config.ts's webServer command builds
      # the SPA before `vite preview` serves it, so the build is owned by the one
      # thing every invocation has to go through. A step here would build it a
      # second time and, worse, would mean CI never exercised the path a
      # developer's `npx playwright test` takes.
      - name: Render the published packages in a browser
        working-directory: harness/frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:harness 2>&1 | tee harness-test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-harness-report
          path: harness/frontend/playwright-report
          retention-days: 7

  # The Gherkin journeys, in a lane of their own.
  #
  # They ran inside `Frontend Harness` first, and that was invisible: the checks
  # list showed no Gherkin, and the job's log read `138 passed` with no way to
  # tell whether any of it was a journey. A suite you cannot see is one nobody
  # notices the absence of — which is the same failure this lane's own gate
  # exists to prevent, one level up.
  #
  # The split is by PROJECT, not a second run of the same tests: `Frontend
  # Harness` now runs `--project=harness` and this runs `--project=journeys`, so
  # the two lanes partition the suite rather than duplicating it. What is
  # duplicated is the setup — install, build, pack, Chromium — because the
  # journeys ship inside the packages and there is no way to compile them
  # without it. That is the price of the lane, and it is paid in parallel.
  gherkin-journeys:
    name: Gherkin Journeys
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Install the harness against the published tarballs
        shell: bash
        run: |
          set -o pipefail
          node scripts/harness-install.mjs 2>&1 | tee harness-install.log
      - name: Install Chromium
        working-directory: harness/frontend
        run: npx playwright install --with-deps chromium
      # No `npm run build` step here either — see `Frontend Harness` above.
      # FIRST, and it starts no browser — it compiles and inspects. It fails on
      # exactly the states a green suite would hide: a feature that produced no
      # spec, a step definition nobody speaks, a scenario with no Then, a
      # committed `.features-gen`, an `@skip`. Running it before the browser
      # means a feature that compiles to nothing is reported as that, rather
      # than as a suite that happens to be smaller.
      - name: Gate the Gherkin journeys
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:bdd 2>&1 | tee bdd-gate.log
      - name: Run the journeys
        working-directory: harness/frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:journeys 2>&1 | tee journeys-test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gherkin-journeys-report
          path: harness/frontend/playwright-report
          retention-days: 7

  # The server half of the same question. The frontend harness proves the
  # published UI renders whatever descriptors it is handed; this proves the
  # published backend produces four of them through its own HTTP handler, and
  # that the prisma schema partial and six migrations it ships actually apply to
  # a real Postgres — assets no other job in this repo ever opens.
  backend-harness:
    name: Backend Harness
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Install the harness against the published tarballs
        shell: bash
        run: |
          set -o pipefail
          node scripts/harness-install.mjs 2>&1 | tee harness-install.log
      - name: Exercise the published backend
        working-directory: harness/backend
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee harness-test.log

  # scripts/publish.mjs decides, from one npm invocation's output, whether a
  # package was skipped, hit a blip worth retrying, or failed for good. Nothing
  # else in this pipeline can check that: `release` runs on push to main ONLY, so
  # a misclassification is discovered as a red main rather than as a red PR — and
  # a wrong branch is quiet, because it still exits and still prints npm's text.
  # This job runs the classification against npm's own words at PR time.
  #
  # Deliberately no `pnpm install`: the self-test is plain node and supplies its
  # own npm on PATH, so the whole job is a checkout and ~20s of node — 15s of
  # which is three real retry backoffs the self-test deliberately does not fake.
  #
  # `release` NEEDS this job, which is the point (a misclassification must not
  # reach a publish) and also the sharp edge: a red self-test stops ALL
  # publishing. Its assertions on the diagnosis therefore match the facts a
  # reader must come away with rather than exact sentences, so that rewording an
  # error message cannot halt releases.
  release-scripts:
    name: Release Scripts
    needs: changes
    if: fromJSON(needs.changes.outputs.changes).code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The package script, not `node scripts/…` spelled out again — same reason
      # the portability job calls `pnpm quality:portability`: one command, so what
      # CI runs and what a developer runs cannot drift apart.
      - name: Publish-outcome classification self-test
        shell: bash
        run: |
          set -o pipefail
          pnpm quality:release 2>&1 | tee release-scripts.log

  # Tokenless publish to npm via OIDC Trusted Publishing. Only on push to main,
  # after the gates pass. No NPM_TOKEN: npm exchanges the GitHub OIDC id-token
  # for a short-lived credential (requires a one-time Trusted Publisher on npm
  # pointing at this repo + ci.yml). semantic-release versions/tags/releases each
  # package (npmPublish:false); the actual upload is the OIDC npm publish below.
  # The one thing OIDC cannot do is a package's first publish — see the step
  # ahead of it, which is the only place a token is ever used.
  release:
    name: Release
    needs: [lint, type-check, build, unit-tests, quality, storybook, consumers, frontend-harness, backend-harness, portability, release-scripts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags + GitHub releases
      issues: write # semantic-release's "release is failing" issue
      pull-requests: write # the `released` label semantic-release puts on a PR
      id-token: write # OIDC trusted publishing — no token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build packages
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      # BEFORE anything is released, un-stick anything a previous run left stuck.
      #
      # A tag for a version npm never received does not merely record a past
      # failure — it STOPS the package releasing, because semantic-release reads
      # that tag and concludes there is nothing new. Deleting it here means the
      # step below re-cuts the version in this same job and the publish step
      # uploads it, so one merge is enough to recover. Doing it after the release
      # instead would need a further merge, and "a further merge" is how
      # auth-v1.22.0 stayed broken for four days.
      #
      # `continue-on-error` because recovery must never be able to WITHHOLD a
      # release. Every step below defaults to `success()`, so without it a repo
      # whose rules forbid deleting a tag — or any crash in this script — would
      # skip semantic-release entirely and stop every healthy package releasing,
      # which is a strictly worse failure than the one being recovered from. The
      # step still goes red and says why, and the orphan it could not clear is
      # caught again by the verification step at the end of this job, which is
      # where the run actually fails.
      - name: Recover tags an earlier run left orphaned
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/recover-orphans.mjs
      # Directory paths, not bare names: payments ships as a nested workspace
      # (packages/payments/{backend,frontend}). Order is topological — a package
      # is released only after everything it depends on, so prepare-publish.mjs
      # always resolves workspace:* interdeps to a version that already exists.
      #
      # This was an inline `for` loop until run 31427350698. Under `set -e` the
      # first package semantic-release failed for ended the step, which skipped
      # every package after it AND the publish step below — stranding everything
      # already tagged as a tag npm never received. It died on `realtime` (11th
      # of 30) over a TLS blip that a retry would have cleared, and took the
      # already-tagged `auth-v1.22.0` down with it. The script retries transient
      # git failures and, when one is genuinely broken, keeps going so the rest
      # still release.
      - name: Version + tag + release (semantic-release)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-tags.mjs
      # OIDC trusted publishing needs npm >= 11.5.1 (Node 24 ships an older npm).
      - name: Upgrade npm for OIDC
        if: ${{ !cancelled() }}
        run: npm install -g npm@latest
      # A package's FIRST publish cannot go through OIDC — a Trusted Publisher is
      # configured on a package that does not exist yet — so it is the one thing
      # the tokenless loop below can never do. This step does exactly that much
      # and no more: it publishes names the registry does not have and skips
      # every package it does. Without an NPM_TOKEN secret it is a no-op.
      - name: First publish for packages not yet on the registry
        if: ${{ !cancelled() }}
        shell: bash
        env:
          # setup-node's npmrc reads this variable, so the bootstrap publish is
          # token-authenticated. The tokenless step below does not set it, and
          # deletes that npmrc line anyway before publishing over OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          # npm cannot resolve workspace:* — rewrite interdeps to concrete versions.
          node scripts/prepare-publish.mjs
          node scripts/first-publish.mjs 2>&1 | tee first-publish.log
      # `!cancelled()` rather than the default `success()`, and this is the single
      # change that would have prevented the auth-v1.22.0 incident outright.
      # Tagging happens per package and publishing happens once at the end, so a
      # tag step that dies part-way has ALREADY pushed tags — and under
      # `success()` this step then refused to run, which is precisely how those
      # tags became versions npm never received. Publishing is idempotent
      # (publish.mjs reports an already-published version as "skipped"), so
      # running it after a partial tag step can only ever help.
      - name: Publish to npm (OIDC, tokenless)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          # npm cannot resolve workspace:* — rewrite interdeps to concrete versions.
          node scripts/prepare-publish.mjs
          # setup-node wrote an empty _authToken=${NODE_AUTH_TOKEN} that SHADOWS
          # OIDC (forcing anonymous auth -> 404). Remove it so npm uses the OIDC
          # id-token for trusted publishing.
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          node scripts/publish.mjs
      # Tagging and publishing are separate steps above, so a run that dies
      # between them leaves a tag for a version npm never received — and that
      # state is silent AND self-perpetuating: semantic-release sees its own tag
      # and cuts nothing forever after, while both steps keep reporting success.
      #
      # LAST, and deliberately not first: a stuck package must report itself
      # without holding every healthy package's release hostage. The publishes
      # above have already happened by the time this fails.
      #
      # `always()` is what makes "LAST" safe, and it is not a nicety. A step with
      # no `if:` defaults to `success()`, so this one was SKIPPED exactly when a
      # publish failed — i.e. in the one situation that MAKES orphaned tags.
      # semantic-release has already written the tag by then; a failed publish is
      # therefore the single most likely way to arrive here with a tag npm never
      # received, and the guard was switching itself off precisely then. Measured:
      # run 31682461784 failed `Publish to npm (OIDC, tokenless)` and reported
      # this step `skipped`, which is why `auth-v1.22.0` went unreported for three
      # days across five red runs.
      #
      # `always()` and `!cancelled()` differ ONLY on cancellation, and nothing is
      # riding on that difference here: `cancel-in-progress` is
      # `github.event_name != 'push'` — false on push — and this job is
      # push-only, so concurrency cannot cancel a running release. (The hazard
      # the concurrency block at the top of this file documents is a PENDING run
      # being dropped, which never starts a job and therefore writes no tag
      # either.) Cancelling this job takes a human or a timeout. `always()` is
      # simply the plainer of two conditions that behave identically for the case
      # that matters, and the check only reads git and the registry — it writes
      # nothing, so running it in a doomed job costs ~20s and can break nothing.
      #
      # It reads PUBLISH_INCOMPLETE / PUBLISH_WEDGED from the step above, which
      # is the other reason it must stay AFTER it: those name the orphans THIS
      # run just made, and an orphan whose publish failed ten lines earlier needs
      # the opposite of the standing "delete the tag and re-run" remedy.
      - name: Verify every release tag reached the registry
        if: always()
        shell: bash
        run: node scripts/verify-released.mjs

      # Everything above reports into this run's log and summary, which is where
      # nobody looks: a release runs on push to main long after its author moved
      # on, and one red Release job sits in a list of green ones. auth-v1.22.0
      # went unreported for four days across five red runs, and was found by a
      # consumer in another repository rather than by anyone here.
      #
      # LAST, so it can see every handoff the steps above wrote to GITHUB_ENV,
      # and `always()` for the same reason the check above it is: the runs worth
      # alerting on are exactly the ones that failed. It maintains ONE issue —
      # reopened, rewritten and finally CLOSED BY ITSELF once every package's
      # newest tag is on the registry — so an open issue always means a live
      # problem, and a fixed pipeline needs nobody to tidy up after it.
      - name: Alert on a release that did not deliver
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOB_STATUS: ${{ job.status }}
          RELEASE_ALERT_WEBHOOK: ${{ secrets.RELEASE_ALERT_WEBHOOK }}
        run: node scripts/release-alert.mjs

  # What this PR's CI has cost, as one comment that is edited in place on every
  # push rather than a new comment per run.
  #
  # This repo is PUBLIC, so these minutes are not billed — the comment says so
  # itself. It is here for gross-minute visibility and trend, which is the thing
  # nobody has today, not for a line on an invoice.
  #
  # `always()` so the estimate still posts when a gate failed: a red run costs
  # the same minutes as a green one, and that is exactly when the number is
  # worth seeing. Deliberately NOT in `ci-success`'s needs — a reporting lane
  # must never be able to fail the merge.
  cost-report:
    name: CI Cost
    if: always() && github.event_name == 'pull_request'
    # Every heavy lane, so the report runs LAST and sees as much of the run as
    # possible. The job's own minutes, and anything still running beside it, are
    # necessarily not counted yet — the comment states that caveat.
    needs: [changes, lint, type-check, build, unit-tests, quality, storybook, consumers, frontend-harness, backend-harness, portability]
    # Required at the caller: a reusable workflow's effective grant is the
    # INTERSECTION with its caller's, so omitting either yields a 403 rather
    # than a wrong number. This job needs no `contents` access at all.
    permissions:
      pull-requests: write
      actions: read
    uses: 12-apps/ci/.github/workflows/cost-report.yml@v2
    secrets: inherit

  # Required-checks aggregation: one status that branch protection can gate on,
  # green only when every prerequisite job succeeded.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    # `changes` MUST be listed even though every other job depends on it. If it
    # FAILS, its dependents go `skipped` — not `failure` — and this aggregation
    # treats `skipped` as fine, so without it a broken change-detector would
    # report green with zero tests run.
    #
    # `release` MUST be listed for a related but distinct reason: it is the only
    # job whose failure nothing else can reveal. Every gate above is also run on
    # the PR, so a broken one is caught before merge; `release` runs ONLY on the
    # push to main, and if it fails the packages simply do not publish. Without
    # it here the run goes green, the merge looks finished, and the gap surfaces
    # much later as a consumer pinning a version that was never cut.
    #
    # That is not hypothetical — it is why this line exists. `@12-apps/auth`'s
    # browser half merged, its release failed on a push race with the release
    # 11 minutes before it, `CI Success` reported green, and the package sat
    # unpublished until a consumer could not resolve `@12-apps/auth/react`.
    #
    # On a pull request `release` is skipped, which this aggregation already
    # treats as fine — so this costs PRs nothing.
    needs: [changes, lint, type-check, build, unit-tests, quality, storybook, consumers, frontend-harness, gherkin-journeys, backend-harness, portability, release-scripts, release]
    steps:
      - name: Verify all required jobs passed
        shell: bash
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Upstream results: $results"
          if echo "$results" | tr ',' '\n' | grep -qvE '^(success|skipped)$'; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
