name: Commit messages

# Conventional-commit gate. The contract is in CONTRIBUTING.md, and the runner
# lives in 12-apps/ci. The rule set is `commitlint.config.mjs` at the repo root:
# the shared workflow's own rules, copied verbatim and passed back through
# `config-path`. It is in the repository because the pre-push hook
# (`.githooks/pre-push`) lints the pushed commits with the same file, so a
# message is refused on the machine instead of here, one push later. A hook
# reading its own copy could disagree with this check; one file cannot.
#
# It is not cosmetic here. `.releaserc.json` runs @semantic-release/commit-analyzer,
# which derives every package's version bump from the commit subjects that land on
# main — so a malformed subject either mis-versions a release or publishes nothing
# at all, silently.
#
# `edited` is load-bearing: this repo squash-merges with COMMIT_OR_PR_TITLE, so a
# multi-commit PR lands its TITLE. A title fixed after the first run has to
# re-trigger the check, or the fix never turns it green.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    uses: 12-apps/ci/.github/workflows/commitlint.yml@v1
    with:
      config-path: commitlint.config.mjs
