name: Major guard

# Holds a pull request that would cut a MAJOR until a person says yes, while its
# commit message is still editable.
#
# Deliberately at PULL-REQUEST time. The gate this replaced sat in ci.yml on
# `push`, where by the time it ran the commit was already on main and the only
# remaining choices were "approve" or "leave the package unreleased" — and one
# batch sat there long enough to hold thirteen majors unpublished. Here the
# major is still a proposal: the cheapest possible moment to reconsider it,
# because rewording the footer undoes it entirely.
#
# TWO JOBS, AND ONLY ONE OF THEM BLOCKS.
#
# `Breaking change` never fails. It reads the PR's commits and prints what they
# would spend, and it writes one output. `Major approval` is the block: it binds
# to the `major-approval` environment, so GitHub holds it in `waiting` and
# reports the check as pending — and a pending REQUIRED check is a pull request
# that cannot be merged, by anyone, including whoever opened it and including
# automation acting with their credentials.
#
# So a declared major has exactly the two exits a person has, and the automation
# has neither: click Review deployments → Approve, or reword the message to drop
# the `RELEASE-MAJOR` marker, after which this job does not run at all (a job
# skipped by its own `if:` counts as passing for a required check).
#
# WHY AN ENVIRONMENT AND NOTHING ELSE. Every other mechanism is reachable by
# this repository's own token: it adds labels, it pushes tags, it opens and
# closes pull requests, and it acts AS the account that owns them, so no rule
# phrased in terms of identity can separate the person from the agent. There
# used to be an `allow-major` label here and it was applied through the API on
# #319 by an agent holding this token — which is the whole argument, made once,
# concretely. Repository settings are the exception: the token gets
# `Resource not accessible by integration` from the branch-protection API and
# cannot grant a deployment. The approval has to live where the token cannot
# reach, and this is the only such place.
#
# `edited` is load-bearing for the same reason commitlint.yml needs it — this
# repo squashes with COMMIT_OR_PR_TITLE, so the PR TITLE can be what lands, and
# a title edited after the first run has to re-trigger the check. There are no
# `labeled`/`unlabeled` triggers because nothing here reads labels any more.
#
# ONE-TIME SETUP, without which the second job is decoration rather than a gate:
# create the `major-approval` environment (Settings → Environments), add at
# least one required reviewer, and mark `Major approval` a required status check
# on `main`. Nothing in this repository can verify that for you — that is the
# same wall that makes it work.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: major-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  major-guard:
    name: Breaking change
    runs-on: ubuntu-latest
    # Read by the gate below.
    outputs:
      major: ${{ steps.guard.outputs.major }}
    steps:
      - uses: actions/checkout@v4

      # Every commit in the PR, not just the head one: the squash keeps each
      # commit's body, so a `RELEASE-MAJOR:` marker anywhere in the branch lands
      # on main and cuts the major.
      #
      # Written as a JSON array rather than piped through a variable because a
      # commit message is multi-line, and no environment variable can carry the
      # separator that would keep the boundaries unambiguous.
      - name: Collect the PR's commit messages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `--slurp` cannot be combined with `--jq` (gh refuses the pair), so the
          # pages are flattened in node instead. `.flat()` is correct whether gh
          # returns an array of pages or one already-merged array.
          gh api "repos/$REPO/pulls/$NUMBER/commits" --paginate --slurp > pages.json
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const messages = JSON.parse(readFileSync("pages.json", "utf8"))
              .flat()
              .map((commit) => commit.commit.message);
            writeFileSync("commits.json", JSON.stringify(messages));
            console.log(`collected ${messages.length} commit(s)`);
          '

      - name: Say what this pull request would release
        id: guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_FILE: commits.json
        run: node scripts/breaking-change-guard.mjs

  # ── The gate a token cannot open ──────────────────────────────────────────
  #
  # No steps worth running: the job IS the question.
  major-approval:
    name: Major approval
    needs: major-guard
    if: needs.major-guard.outputs.major == 'true'
    runs-on: ubuntu-latest
    environment: major-approval
    steps:
      - name: Record the approval
        run: |
          echo "::notice::A major release was approved by a human for this pull request."
