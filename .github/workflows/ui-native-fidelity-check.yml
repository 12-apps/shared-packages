name: UI Native Fidelity Verification

on:
  push:
    branches: [ci/ui-native-fidelity]

permissions:
  contents: read

concurrency:
  group: ui-native-fidelity-verification
  cancel-in-progress: true

env:
  CI: 'true'
  STORYBOOK_DISABLE_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: Verify shared UI additions without publication
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile
      - name: Build both UI renderers and their dependencies
        run: pnpm exec turbo run build --filter=@12-apps/ui
      - name: Check package types and lint
        working-directory: packages/ui
        run: |
          pnpm check-types
          pnpm lint
      - name: Test the changed web components and prior Dialog contracts
        working-directory: packages/ui
        run: pnpm test src/components/data-display/Progress/ src/components/feedback/Dialog/ src/icons/Icon.test.tsx
      - name: Test the changed native components and prior Dialog contracts
        working-directory: packages/ui
        run: pnpm test:native src/components/data-display/Progress/ src/components/feedback/Dialog/ src/icons/Icon.native.test.tsx
      - name: Check tokens, stories types, glyphs and parity ledger
        run: |
          pnpm quality:ui-tokens
          pnpm quality:ui-stories-types
          pnpm --filter @12-apps/ui native:check
      - name: Install the browser used by the repository
        working-directory: packages/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the web Storybook
        run: pnpm --filter @12-apps/ui storybook:build
      - name: Drive the changed web Storybook components
        working-directory: packages/ui
        run: >-
          pnpm exec start-server-and-test 'http-server storybook-static -p 6008 --silent'
          http://127.0.0.1:6008
          'test-storybook --url http://127.0.0.1:6008 --index-json --includeTags component:Progress component:Dialog component:Icon --maxWorkers=2'
      - name: Capture and assert the new web states
        working-directory: packages/ui
        run: >-
          pnpm exec start-server-and-test 'http-server storybook-static -p 6008 --silent'
          http://127.0.0.1:6008
          'node ../../scripts/verify-ui-native-fidelity.mjs web http://127.0.0.1:6008'
      - name: Build the native-renderer Storybook
        run: pnpm --filter @12-apps/ui storybook:native:build
      - name: Drive the changed native-renderer Storybook components
        working-directory: packages/ui
        run: >-
          pnpm exec start-server-and-test 'http-server storybook-native-static -p 6009 --silent'
          http://127.0.0.1:6009
          'test-storybook --url http://127.0.0.1:6009 --config-dir .storybook-native --index-json --includeTags component:Progress component:Dialog component:Icon --excludeTags native-skip --maxWorkers=2'
      - name: Capture and assert the new native-renderer states
        working-directory: packages/ui
        run: >-
          pnpm exec start-server-and-test 'http-server storybook-native-static -p 6009 --silent'
          http://127.0.0.1:6009
          'node ../../scripts/verify-ui-native-fidelity.mjs native http://127.0.0.1:6009'
      - name: Upload the exact-commit verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-native-fidelity-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            verification/ui-native-fidelity
            packages/ui/test-results
