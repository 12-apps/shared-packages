# Apache prefork: one PHP process per request, and at most four of them.
#
# A 990-item NF-e (the layout's maximum) built, signed and validated peaks at
# 36 MB of PHP memory (measured 2026-11-13); php.ini caps a request at 128M, so
# four workers bound the service at 4 x 128M = 512M in the worst case and about
# 4 x 40M in practice, a slice a 1-2 GB droplet without swap can give it beside
# the API and the worker. Four is also enough concurrency: a burst of 60 NFC-e a
# minute at roughly one second of SEFAZ latency each keeps one or two busy; the
# rest wait in the listen backlog instead of growing the process count.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers        4
    ServerLimit              4
    MaxConnectionsPerChild   500
</IfModule>
