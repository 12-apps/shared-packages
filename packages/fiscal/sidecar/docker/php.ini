; The fiscal service's PHP settings, on top of php.ini-production.
; Nothing reaches a log but what the service writes itself; nothing reaches disk.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
; A stack trace never carries an argument (a password, a certificate).
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
; JSON bodies only: no multipart, so PHP never spools an upload to /tmp.
file_uploads = Off
enable_post_data_reading = On
post_max_size = 8M
memory_limit = 128M
max_execution_time = 120
session.auto_start = 0
opcache.enable = 1
opcache.validate_timestamps = 0
