# Every path goes to the front controller; nothing else is served.
<VirtualHost *:8080>
    DocumentRoot /app/public
    <Directory /app/public>
        Options None
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # The request line carries no secret: every input is in the JSON body, and
    # the service writes its own line per request to stderr.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%h %t \"%r\" %>s %b %D"
</VirtualHost>
